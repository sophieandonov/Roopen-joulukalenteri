<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joulukalenteri</title>
    <!-- Ladataan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ladataan kauniit serif- ja sans-serif-fontit Google Fontsista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        cream: '#F6F1E9',
                        paper: '#FDFBF7',
                        beige: '#EAD8B1',
                        gold: '#D8C39E',
                        sage: '#D6DEC8',
                        crimson: '#B22A2A',
                        charcoal: '#2C2A29',
                    }
                }
            }
        }
    </script>

    <style>
        /* Taustan hienovarainen tekstuuriefekti ja pehmeä siirtymä */
        body {
            background-color: #F6F1E9;
            background-image: radial-gradient(#E5DEC9 0.75px, transparent 0.75px);
            background-size: 24px 24px;
            color: #2C2A29;
        }

        /* Luukkujen hover- ja klikkausanimaatiot */
        .door-card {
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.3s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .door-card:hover {
            transform: translateY(-6px) scale(1.03);
            filter: drop-shadow(0 12px 18px rgba(44, 42, 41, 0.12));
        }

        .door-card:active {
            transform: scale(0.97);
        }

        /* Ravistusefekti kun lukittua luukkua klikataan */
        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px) rotate(-1.5deg); }
            40% { transform: translateX(5px) rotate(1.5deg); }
            60% { transform: translateX(-4px) rotate(-1deg); }
            80% { transform: translateX(4px) rotate(1deg); }
        }

        .shake-door {
            animation: gentleShake 0.45s ease-in-out;
        }

        /* Modalin animaatiot */
        .modal-backdrop {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
        }

        /* Lentävän joulupukin animaatio ruudun poikki (Luukku 24) */
        @keyframes flyAcrossScreen {
            0% {
                transform: translate(-110%, 15px) rotate(-4deg);
            }
            25% {
                transform: translate(20vw, -18px) rotate(2deg);
            }
            50% {
                transform: translate(55vw, 10px) rotate(-2deg);
            }
            75% {
                transform: translate(85vw, -15px) rotate(3deg);
            }
            100% {
                transform: translate(115vw, 5px) rotate(-1deg);
            }
        }

        .santa-fly {
            animation: flyAcrossScreen 5.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-crimson selection:text-paper overflow-x-hidden">

    <!-- Yläpalkki ja Testitila-kytkin -->
    <header class="w-full max-w-6xl mx-auto px-4 pt-6 pb-2 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2 text-charcoal/70 text-sm font-sans">
        </div>

        <!-- Huomaamaton esikatselu- / testitilakytkin luukkujen testaamiseen -->
        <div class="flex items-center gap-3 bg-paper/80 backdrop-blur-sm border border-charcoal/10 px-3.5 py-2 rounded-full shadow-sm">
            <span class="text-xs font-medium text-charcoal/80">Esikatselutila (avaa kaikki)</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="previewToggle" class="sr-only peer">
                <div class="w-9 h-5 bg-charcoal/20 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-crimson"></div>
            </label>
        </div>
    </header>

    <!-- Otsikko-osio -->
    <main class="w-full max-w-5xl mx-auto px-4 py-6 sm:py-10 flex-grow">
        <div class="text-center mb-10 sm:mb-14">
            <div class="inline-flex items-center justify-center mb-2 text-crimson/80">
                <!-- Pieni sydänkuvake kuten esimerkkikuvassa -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                </svg>
            </div>
            <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-charcoal mb-3">
                Roopen joulukalenteri
            </h1>
        </div>

        <!-- 31 Luukun ruudukko -->
        <div id="calendarGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5 sm:gap-7 items-center justify-items-center">
            <!-- Luukut luodaan dynaamisesti JavaScriptillä -->
        </div>
    </main>

    <!-- Alatunniste ja nollauspainike -->
    <footer class="w-full max-w-5xl mx-auto px-4 py-8 text-center text-xs text-charcoal/50 flex flex-col sm:flex-row items-center justify-between gap-3 border-t border-charcoal/10 mt-10">
        <button id="resetProgressBtn" class="hover:text-crimson underline transition-colors cursor-pointer">
            Nollaa avatut luukut
        </button>
    </footer>

    <!-- Kelluva ilmoitus (Toast), kun luukku ei ole vielä auennut (kuten kuvassa) -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-4 transition-all duration-300 w-[90%] max-w-sm">
        <div class="bg-paper/95 backdrop-blur-md border border-charcoal/15 shadow-xl rounded-2xl px-5 py-4 flex items-center gap-3.5">
            <div class="w-9 h-9 rounded-full bg-cream flex items-center justify-center shrink-0 text-charcoal/80 border border-charcoal/10">
                <!-- Lukkoikoni -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <div class="text-left">
                <p class="font-sans text-xs font-semibold text-charcoal">Ei vielä!</p>
                <p id="toastMessage" class="font-sans text-xs text-charcoal/75 mt-0.5">
                    Tämä yllätys aukeaa 1. joulukuuta.
                </p>
            </div>
        </div>
    </div>

    <!-- Modali (kortti), joka avautuu kun luukku avataan -->
    <div id="doorModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop bg-charcoal/40 backdrop-blur-xs opacity-0">
        <div id="modalCard" class="bg-paper border border-charcoal/10 rounded-3xl shadow-2xl max-w-md w-full p-7 sm:p-9 relative text-center transform scale-95 opacity-0 modal-content">
            <!-- Sulje-painike oikeassa yläkulmassa -->
            <button id="closeModalBtn" aria-label="Sulje" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-cream hover:bg-beige/60 flex items-center justify-center text-charcoal/70 hover:text-charcoal transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Päivän numero ja koriste -->
            <div id="modalBadge" class="inline-flex items-center justify-center px-4 py-1 rounded-full bg-cream border border-charcoal/10 text-xs font-semibold tracking-widest uppercase text-crimson mb-4">
                Luukku 01
            </div>

            <h2 id="modalTitle" class="font-serif text-3xl sm:text-4xl font-semibold text-charcoal mb-4">
                1. joulukuuta
            </h2>

            <div class="w-12 h-px bg-charcoal/15 mx-auto mb-5"></div>

            <!-- Käyttäjän oma teksti tulee tähän -->
            <div id="modalBody" class="font-sans text-base sm:text-lg leading-relaxed text-charcoal/90 whitespace-pre-line mb-7">
                Tähän tulee luukun teksti.
            </div>

            <button id="modalActionBtn" class="w-full py-3 px-6 rounded-2xl bg-charcoal text-paper font-sans text-sm font-medium hover:bg-crimson transition-colors cursor-pointer shadow-sm">
                Sulje luukku
            </button>
        </div>
    </div>

    <!-- Koko ruudun peittävä tehostekangas (glitteri ja ilotulitukset) -->
    <canvas id="effectsCanvas" class="fixed inset-0 pointer-events-none z-[60] w-full h-full"></canvas>

    <!-- Lentävä joulupukki ja porot (Luukku 24) -->
    <div id="santaContainer" class="fixed top-14 sm:top-20 left-0 z-[65] pointer-events-none hidden">
        <div id="santaSleigh" class="flex items-center gap-1 drop-shadow-xl">
            <svg width="340" height="95" viewBox="0 0 340 95" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Taikapölyvana reen perässä -->
                <circle cx="15" cy="65" r="2.5" fill="#E3C16F" opacity="0.8"/>
                <circle cx="28" cy="58" r="1.8" fill="#FDFBF7" opacity="0.9"/>
                <circle cx="40" cy="70" r="2.2" fill="#E3C16F" opacity="0.7"/>
                <circle cx="52" cy="62" r="1.5" fill="#B22A2A" opacity="0.7"/>

                <!-- Reki -->
                <path d="M55 72 L135 72 C145 72, 152 64, 152 56" stroke="#C5A049" stroke-width="3" stroke-linecap="round"/>
                <line x1="72" y1="62" x2="72" y2="72" stroke="#C5A049" stroke-width="2.5"/>
                <line x1="118" y1="62" x2="118" y2="72" stroke="#C5A049" stroke-width="2.5"/>
                <path d="M58 42 C58 58, 68 63, 85 63 L125 63 C136 63, 142 54, 140 45 L122 45 C118 52, 102 52, 95 42 Z" fill="#B22A2A" stroke="#8E1E1E" stroke-width="1.5"/>
                <path d="M58 42 L95 42" stroke="#E3C16F" stroke-width="2.5" stroke-linecap="round"/>

                <!-- Lahjasäkki -->
                <circle cx="76" cy="36" r="11" fill="#8C6D46"/>
                <rect x="82" y="29" width="9" height="9" rx="1.5" fill="#D6DEC8" transform="rotate(12 82 29)"/>

                <!-- Joulupukki -->
                <circle cx="106" cy="36" r="9" fill="#B22A2A"/>
                <!-- Pukin parta ja kasvot -->
                <circle cx="108" cy="24" r="6" fill="#F5D6C6"/>
                <path d="M103 25 C103 33, 114 33, 114 25 Z" fill="#FDFBF7"/>
                <!-- Tonttulakki -->
                <path d="M101 21 C103 12, 112 12, 114 21 Z" fill="#B22A2A"/>
                <circle cx="100" cy="18" r="2.5" fill="#FDFBF7"/>
                <rect x="101" y="19.5" width="14" height="3" rx="1.5" fill="#FDFBF7"/>

                <!-- Ohjakset poroille -->
                <path d="M114 35 Q165 48, 215 44" stroke="#C5A049" stroke-width="1.2" fill="none"/>
                <path d="M114 35 Q215 48, 282 43" stroke="#C5A049" stroke-width="1.2" fill="none"/>

                <!-- Takimmainen poro -->
                <g transform="translate(195, 28)">
                    <ellipse cx="22" cy="24" rx="13" ry="7" fill="#7A5638"/>
                    <line x1="13" y1="29" x2="9" y2="41" stroke="#7A5638" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="30" y1="29" x2="35" y2="40" stroke="#7A5638" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M30 21 L36 12 L42 14 L38 22 Z" fill="#7A5638"/>
                    <!-- Sarvet -->
                    <path d="M35 12 L33 4 M33 7 L30 6 M37 12 L39 5" stroke="#D8C39E" stroke-width="1.5" stroke-linecap="round"/>
                </g>

                <!-- Etummainen poro (Petteri Punakuono) -->
                <g transform="translate(262, 24)">
                    <ellipse cx="22" cy="24" rx="14" ry="7.5" fill="#8C623E"/>
                    <line x1="13" y1="29" x2="8" y2="42" stroke="#8C623E" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="31" y1="29" x2="37" y2="41" stroke="#8C623E" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M31 21 L38 11 L45 14 L40 22 Z" fill="#8C623E"/>
                    <!-- Sarvet -->
                    <path d="M36 11 L34 2 M34 6 L31 5 M39 11 L41 3" stroke="#D8C39E" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- Hohtava punainen nenä -->
                    <circle cx="45" cy="14" r="2.8" fill="#E63946"/>
                    <circle cx="45" cy="14" r="5.5" fill="#E63946" opacity="0.35"/>
                </g>
            </svg>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 🎄 KIRJOITA OMAT TEKSTISI JOKAISELLE PÄIVÄLLE TÄHÄN ALLE (Päivät 1–31)! 🎄
         * Muokkaa vain lainausmerkkien (" ") sisällä olevia tekstejä.
         * Voit käyttää rivinvaihtoja kirjoittamalla \n tai käyttämällä backtick-merkkejä (`).
         * ============================================================================
         */
        const luukkujenTekstit = {
                1: "Ihanaa joulukuun ensimmäistä päivää! Tästä alkaa yhteinen matkamme kohti joulua, uutta vuotta ja lähtölaskenta päivään kun tulen takaisin!",
                2: "Toivottavasti sulla on hyvä päivä siellä! Vaikka onkin vasta keskiviikko... :D",
	            3: "Nauti sun vapaudesta ennen kuin alkaa maisterintutkinto!",
	            4: "Perjantaaaii!!! Woop Woop! Saat valvoo pitkään tänään, mutta sut tuntien varmaaan nukahat sohvalle XD ja kuorsaat vähän",
	            5: "Varmaan näät jotain kamua tänään, joten sanon, että pitäkää hauskaa!",
	            6: "Hyvää itsenäisyyspäivää! Oon niin kateellinen, että voit kattoa kaikki itsenäisyyspäivän ohjelmat.",
	            7: "Moi, mun rakas! Toivottavasti et oo vaipunu masennukseen mun poissaolonn takia. Mä tuun kyllä takas!:D",
	            8: "Ihanaa maanantaita sulle, mun ihana <3 ",
	            9: "Oot tosi ihana ja rakas.",
	            10: "Oon todellaan onnellinen, että oon saanut sut mun elämään. Oot paras!",
	            11: "Freaky friday! Menitkö afterworkkiin vai ootko vaan kotona? Mietin sua. <3",
	            12: "Jos olit nätisti eilen nii riehutko sitten tänään? :D Älä riehu liikaa!",
	            13: "Oot mulle niin tärkeä. <3",
	            14: "Haluisin kattoo sun silmiä ja hymyä. Niin ikävä sun pehmeitä käsiä <3",
	            15: "Muista kuunnella musiikkia nyt kun en ole siellä :D Mun ihana <3",
	            16: "Moi mun ihana. Sun isällä on synttärit tänään! Terveisiä multa sille!",
	            17: "Moi mun rakas. Toivottavasti et valvo kauheesti tämän kuukauden aikana. Mene viimeistään klo 21.30 sänkyyn tänään!",
	            18: "Hyvää syntymäpäivää mulle! Tiedän, että sua harmittaa, kun ei olla yhdessä tänään. Jos helpottaa mieltä niin mä sain vihdoin toteutettua mun lapsuuden unelman. Mulla on synttärit lämpimässä!!",
	            19: "Niin kauhea ikävä sua. Toivottavasti sulla on hyvä päivä siellä!",
	            20: "Unelmoin siitä, että pääsen pian takas sun luo. <3",
	            21: "Oon nii onnellinen ja kiitollinen, että oot mun elämässä.",
	            22: "Oot niin lämmin ja pehmeä ja tuoksut taivaalliselta. Haluisin halia sun kanssa niiiin paljon. <3",
	            23: "Enää yks päivä jouluun! Kokeile nauttia joulusta, vaikka ootkin vähän Grinch. Rakastan sua <3",
	            24: "Hyvää joulua, mun rakas! Ihan kauhea ikävä sua. Syö paljon jouluruokaa mun puolestaa! Terveisiä Merville ja Tytille!",
	            25: "Leiki paljon koirien kanssa! Mun puolesta myös.",
	            26: "Oot paras ja ihana ja tosi rakas!",
	            27: "Älä jäädy siellä! Tai sitten sulla on just sopiva ilman mua :D Tuun kuitenkin halimaan halusitpa tai et!! ",
	            28: "Muista, että Niko-Markuksella on tänään synttärit!",
	            29: "Nää päivät on ihan tylsiä yleensä. Se on ihan ookoo, että on tylsää joskus i guess. Teet varmaan paljon töitä. Aika varmaan menee nopeammin",
	            30: "Kohta tää vuosi on ohi. Tämän vuoden jälkeen ei enää olla näin pitkään erossa!!",
	            31: "Hyvää uutta vuotta! Nähdään alle viikon päästä!!! En jaksa oottaa enää et pääsen näkee sua!!!!"
	        };

            
        /**
         * ============================================================================
         * KALENTERIN TOIMINTALOGIIKKA JA ERIKOISEFEKTIT
         * ============================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendarGrid');
            const previewToggle = document.getElementById('previewToggle');
            const toastNotification = document.getElementById('toastNotification');
            const toastMessage = document.getElementById('toastMessage');
            const doorModal = document.getElementById('doorModal');
            const modalCard = document.getElementById('modalCard');
            const modalBadge = document.getElementById('modalBadge');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalActionBtn = document.getElementById('modalActionBtn');
            const resetProgressBtn = document.getElementById('resetProgressBtn');
            const effectsCanvas = document.getElementById('effectsCanvas');
            const ctx = effectsCanvas.getContext('2d');
            const santaContainer = document.getElementById('santaContainer');
            const santaSleigh = document.getElementById('santaSleigh');

            let toastTimeout = null;
            let santaTimeout = null;
            const STORAGE_KEY = 'sophie_advent_opened_doors_v2';

            // Haetaan avatut luukut selaimen muistista
            let openedDoors = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

            // Hillitty väripaletti (lämmin beige, salvia, kulta, syvä punainen)
            const palette = [
                { fill: '#EAD8B1', text: '#2C2A29', accent: '#D5C095' }, // Lämmin beige
                { fill: '#B22A2A', text: '#FDFBF7', accent: '#8E1E1E' }, // Joulunpunainen
                { fill: '#D6DEC8', text: '#2C2A29', accent: '#BCC7AA' }, // Salvianvihreä
                { fill: '#EFE6D5', text: '#2C2A29', accent: '#DDD0B8' }, // Vaalea kerma
                { fill: '#E2C999', text: '#2C2A29', accent: '#CBB07D' }, // Pehmeä kulta
            ];

            // =========================================================================
            // CANVAS-EFEKTIT: GLITTERI (Luukku 18) & ILOTULITUKSET (Luukku 31)
            // =========================================================================
            let particles = [];
            let animationFrameId = null;

            function resizeCanvas() {
                effectsCanvas.width = window.innerWidth;
                effectsCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Käynnistää kimaltelevan glitterisateen (Luukku 18)
            function triggerGlitterEffect() {
                const glitterColors = ['#FFD700', '#FFF8DC', '#F4C2C2', '#E3C16F', '#FFFFFF', '#FADADD'];
                const count = 170;

                for (let i = 0; i < count; i++) {
                    particles.push({
                        type: 'glitter',
                        x: Math.random() * effectsCanvas.width,
                        y: -20 - Math.random() * 250,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: 2 + Math.random() * 3.8,
                        size: 3 + Math.random() * 5,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.15,
                        shimmerSpeed: 0.08 + Math.random() * 0.12,
                        shimmerPhase: Math.random() * Math.PI * 2,
                        color: glitterColors[Math.floor(Math.random() * glitterColors.length)],
                        alpha: 1,
                        life: 240 + Math.random() * 100
                    });
                }
                startParticleLoop();
            }

            // Luo yhden ilotulitusräjähdyksen
            function spawnFireworkBurst(x, y) {
                const fireworkColors = ['#FFD700', '#FF4D4D', '#FF9F1C', '#FFFDF7', '#E3C16F', '#FF70A6', '#70D6FF'];
                const baseColor = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                const sparkCount = 65;

                for (let i = 0; i < sparkCount; i++) {
                    const angle = (Math.PI * 2 * i) / sparkCount + (Math.random() - 0.5) * 0.15;
                    const speed = 1.8 + Math.random() * 5.2;
                    particles.push({
                        type: 'firework',
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 2.2 + Math.random() * 2.2,
                        color: Math.random() > 0.3 ? baseColor : '#FFFDF7',
                        alpha: 1,
                        decay: 0.012 + Math.random() * 0.01,
                        trail: []
                    });
                }
            }

            // Käynnistää ilotulitusesityksen (Luukku 31)
            function triggerFireworksEffect() {
                const bursts = 7;
                for (let i = 0; i < bursts; i++) {
                    setTimeout(() => {
                        const x = effectsCanvas.width * (0.18 + Math.random() * 0.64);
                        const y = effectsCanvas.height * (0.15 + Math.random() * 0.42);
                        spawnFireworkBurst(x, y);
                        startParticleLoop();
                    }, i * 480);
                }
            }

            // Käynnistää lentävän joulupukin (Luukku 24)
            function triggerFlyingSanta() {
                clearTimeout(santaTimeout);
                santaContainer.classList.remove('hidden');
                santaSleigh.classList.remove('santa-fly');
                void santaSleigh.offsetWidth; // Pakottaa animaation uudelleenkäynnistyksen
                santaSleigh.classList.add('santa-fly');

                santaTimeout = setTimeout(() => {
                    santaContainer.classList.add('hidden');
                    santaSleigh.classList.remove('santa-fly');
                }, 5700);
            }

            // Animaatiosilmukka partikkeleille
            function startParticleLoop() {
                if (animationFrameId) return;

                function animate() {
                    ctx.clearRect(0, 0, effectsCanvas.width, effectsCanvas.height);

                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];

                        if (p.type === 'glitter') {
                            p.x += p.vx + Math.sin(p.y * 0.02) * 0.6;
                            p.y += p.vy;
                            p.rotation += p.vRot;
                            p.shimmerPhase += p.shimmerSpeed;
                            p.life--;

                            if (p.life < 50) {
                                p.alpha = Math.max(0, p.life / 50);
                            }

                            const twinkle = 0.45 + 0.55 * Math.abs(Math.sin(p.shimmerPhase));
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.rotation);
                            ctx.globalAlpha = p.alpha * twinkle;
                            ctx.fillStyle = p.color;

                            // Timantin / tähtihileen muotoinen glitteri
                            ctx.beginPath();
                            ctx.moveTo(0, -p.size);
                            ctx.lineTo(p.size * 0.55, 0);
                            ctx.lineTo(0, p.size);
                            ctx.lineTo(-p.size * 0.55, 0);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();

                            if (p.y > effectsCanvas.height + 30 || p.life <= 0) {
                                particles.splice(i, 1);
                            }
                        } else if (p.type === 'firework') {
                            p.trail.push({ x: p.x, y: p.y });
                            if (p.trail.length > 5) p.trail.shift();

                            p.vx *= 0.965;
                            p.vy *= 0.965;
                            p.vy += 0.065; // Painovoima
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= p.decay;

                            if (p.alpha <= 0) {
                                particles.splice(i, 1);
                                continue;
                            }

                            // Piirretään kipinän häntä
                            ctx.save();
                            ctx.beginPath();
                            if (p.trail.length > 1) {
                                ctx.moveTo(p.trail[0].x, p.trail[0].y);
                                for (let t = 1; t < p.trail.length; t++) {
                                    ctx.lineTo(p.trail[t].x, p.trail[t].y);
                                }
                            }
                            ctx.strokeStyle = p.color;
                            ctx.globalAlpha = p.alpha * 0.5;
                            ctx.lineWidth = p.size * 0.8;
                            ctx.stroke();

                            // Piirretään kirkas kipinäpiste
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    if (particles.length > 0) {
                        animationFrameId = requestAnimationFrame(animate);
                    } else {
                        animationFrameId = null;
                        ctx.clearRect(0, 0, effectsCanvas.width, effectsCanvas.height);
                    }
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            // =========================================================================
            // KALENTERIN APUFUNKTIOT JA LUUKKUJEN MUODOT
            // =========================================================================

            // Muotoilee numeron kahdella numerolla (esim. 1 -> "01")
            function formatDayNumber(day) {
                return day < 10 ? `0${day}` : `${day}`;
            }

            // Tarkistaa saako luukun avata nykyisen päivämäärän (tai esikatselutilan) perusteella
            function isDoorUnlocked(day) {
                if (previewToggle.checked) return true;

                const now = new Date();
                const currentMonth = now.getMonth(); // 11 = Joulukuu (0-indeksoitu)
                const currentDate = now.getDate();

                // Jos on joulukuu (kuukausi 11) ja päivä on >= luukun numero, luukku on auki
                if (currentMonth === 11 && currentDate >= day) {
                    return true;
                }
                return false;
            }

            // Näyttää kelluvan ilmoituksen jos luukku on vielä lukittu
            function showLockedToast(day) {
                toastMessage.textContent = `Tämä yllätys aukeaa ${day}. joulukuuta.`;
                toastNotification.classList.remove('opacity-0', 'translate-y-4');
                toastNotification.classList.add('opacity-100', 'translate-y-0');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastNotification.classList.remove('opacity-100', 'translate-y-0');
                    toastNotification.classList.add('opacity-0', 'translate-y-4');
                }, 3200);
            }

            // Avaa luukun sisällön modaali-ikkunaan ja laukaisee mahdolliset erikoisefektit
            function openDoorModal(day) {
                const formatted = formatDayNumber(day);
                if (day === 6) {
                    modalBadge.textContent = `Luukku ${formatted} • Itsenäisyyspäivä`;
                } else if (day === 18) {
                    modalBadge.textContent = `Luukku ${formatted} • Sophie ✨`;
                } else if (day === 24) {
                    modalBadge.textContent = `Luukku ${formatted} • Jouluaatto 🎅`;
                } else if (day === 31) {
                    modalBadge.textContent = `Luukku ${formatted} • Uudenvuodenaatto 🎆`;
                } else {
                    modalBadge.textContent = `Luukku ${formatted}`;
                }
                modalTitle.textContent = `${day}. joulukuuta`;
                modalBody.textContent = luukkujenTekstit[day] || "Hyvää joulun odotusta!";

                // Erikoisefektit tietyille päiville
                if (day === 18) {
                    triggerGlitterEffect();
                } else if (day === 24) {
                    triggerFlyingSanta();
                } else if (day === 31) {
                    triggerFireworksEffect();
                }

                // Tallennetaan luukku avatuksi
                if (!openedDoors.includes(day)) {
                    openedDoors.push(day);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(openedDoors));
                    renderCalendar();
                }

                // Näytetään modaali pehmeällä animaatiolla
                doorModal.classList.remove('hidden');
                doorModal.classList.add('flex');
                requestAnimationFrame(() => {
                    doorModal.classList.remove('opacity-0');
                    doorModal.classList.add('opacity-100');
                    modalCard.classList.remove('scale-95', 'opacity-0');
                    modalCard.classList.add('scale-100', 'opacity-100');
                });
            }

            // Sulkee modaali-ikkunan
            function closeDoorModal() {
                doorModal.classList.remove('opacity-100');
                doorModal.classList.add('opacity-0');
                modalCard.classList.remove('scale-100', 'opacity-100');
                modalCard.classList.add('scale-95', 'opacity-0');

                setTimeout(() => {
                    doorModal.classList.add('hidden');
                    doorModal.classList.remove('flex');
                }, 300);
            }

            /**
             * Luo kullekin päivälle sopivan SVG-muodon:
             * - Päivä 6: Liehuva Suomen lippu
             * - Päivä 18: Joulusukka, jossa lukee "Sophie"
             * - Päivä 24: Tähti
             * - Päivä 31: Uudenvuoden juhlava samppanjalasi
             * - Muut päivät: Vuorottelevat joulukuuset ja koristepallot
             */
            function createDoorSVG(day, isOpened) {
                const numStr = formatDayNumber(day);
                const color = palette[(day - 1) % palette.length];
                const checkBadge = isOpened ? `
                    <g transform="translate(102, 18)">
                        <circle cx="0" cy="0" r="10" fill="#2C2A29" opacity="0.85"/>
                        <path d="M-4 0.5 L-1.2 3.2 L4.2 -2.5" stroke="#FDFBF7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                ` : '';

                // 0) PÄIVÄ 6: ITSENÄISYYSPÄIVÄN LIEHUVA SUOMEN LIPPU
                if (day === 6) {
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <defs>
                            <clipPath id="finlandFlagClip">
                                <path d="M24 34 C46 25, 72 41, 108 32 L108 92 C72 101, 46 85, 24 94 Z" />
                            </clipPath>
                        </defs>
                        <line x1="21" y1="22" x2="21" y2="128" stroke="#9C8C74" stroke-width="3.5" stroke-linecap="round"/>
                        <circle cx="21" cy="20" r="4" fill="#D9B773" stroke="#B59352" stroke-width="1"/>
                        <g clip-path="url(#finlandFlagClip)">
                            <rect x="20" y="20" width="95" height="85" fill="#FDFBF7"/>
                            <path d="M20 55 C46 47, 72 62, 112 53 L112 71 C72 80, 46 65, 20 73 Z" fill="#1D4E89"/>
                            <rect x="46" y="20" width="17" height="85" fill="#1D4E89"/>
                            <path d="M68 20 C75 50, 75 75, 68 105 L86 105 C93 75, 93 50, 86 20 Z" fill="#2C2A29" opacity="0.05"/>
                        </g>
                        <path d="M24 34 C46 25, 72 41, 108 32 L108 92 C72 101, 46 85, 24 94 Z" 
                              fill="none" stroke="#D8CEBE" stroke-width="1.5" stroke-linejoin="round"/>
                        <circle cx="88" cy="77" r="13" fill="#FDFBF7" opacity="0.92"/>
                        <text x="88" y="82.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="18" fill="#1D4E89">
                            06
                        </text>
                        ${checkBadge}
                    </svg>`;
                }

                // 1) PÄIVÄ 18: JOULUSUKKA JOSSA LUKEE SOPHIE
                if (day === 18) {
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <path d="M44 16 C40 6, 54 6, 50 18" fill="none" stroke="#8E1E1E" stroke-width="3" stroke-linecap="round"/>
                        <path d="M45 34 L85 34 L85 88 C85 112, 68 124, 42 124 C24 124, 15 112, 18 98 C21 86, 35 84, 45 84 Z" 
                              fill="#B22A2A" stroke="#8E1E1E" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M85 78 C74 78, 70 90, 81 98 C84 94, 85 88, 85 78 Z" fill="#D8C39E" opacity="0.45"/>
                        <path d="M26 93 C18 96, 15 108, 22 118 C30 112, 31 100, 26 93 Z" fill="#D8C39E" opacity="0.45"/>
                        <rect x="40" y="16" width="50" height="22" rx="7" fill="#FDFBF7" stroke="#E2D6C3" stroke-width="1.5"/>
                        <text x="65" y="31" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="14.5" fill="#B22A2A">
                            Sophie
                        </text>
                        <text x="62" y="74" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="27" fill="#FDFBF7">
                            18
                        </text>
                        ${checkBadge}
                    </svg>`;
                }

                // 2) PÄIVÄ 24: JOULUAATON KULTAINEN TÄHTI
                if (day === 24) {
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <line x1="65" y1="4" x2="65" y2="18" stroke="#B59352" stroke-width="2" stroke-linecap="round"/>
                        <path d="M65 14 L79.5 48 L116 51.5 L88 75.5 L96.5 111 L65 92 L33.5 111 L42 75.5 L14 51.5 L50.5 48 Z" 
                              fill="#E3C16F" stroke="#C5A049" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M65 22 L76.5 49.5 L106 52.5 L83.5 72 L90.5 101 L65 85.5 L39.5 101 L46.5 72 L24 52.5 L53.5 49.5 Z" 
                              fill="#FDFBF7" opacity="0.22"/>
                        <text x="65" y="73" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="28" fill="#2C2A29">
                            24
                        </text>
                        ${checkBadge}
                    </svg>`;
                }

                // 3) PÄIVÄ 31: UUDENVUODENAATON SAMPPANJALASI JA SÄIHKE
                if (day === 31) {
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <!-- Pienet ilotulitustähdet ympärillä -->
                        <path d="M28 24 L30 30 L36 32 L30 34 L28 40 L26 34 L20 32 L26 30 Z" fill="#D9B773"/>
                        <path d="M102 20 L103.5 24.5 L108 26 L103.5 27.5 L102 32 L100.5 27.5 L96 26 L100.5 24.5 Z" fill="#B22A2A" opacity="0.8"/>
                        <circle cx="96" cy="44" r="2.5" fill="#E3C16F"/>
                        <circle cx="34" cy="48" r="2" fill="#B22A2A" opacity="0.7"/>

                        <!-- Lasin jalka ja pohja -->
                        <line x1="65" y1="86" x2="65" y2="122" stroke="#C5A049" stroke-width="3.5" stroke-linecap="round"/>
                        <ellipse cx="65" cy="123" rx="22" ry="4.5" fill="#E3C16F" stroke="#C5A049" stroke-width="1.5"/>

                        <!-- Samppanjamalja -->
                        <path d="M44 24 L86 24 L82 66 C80 80, 73 87, 65 87 C57 87, 50 80, 48 66 Z" 
                              fill="#FDFBF7" stroke="#C5A049" stroke-width="2" stroke-linejoin="round"/>
                        <!-- Kultainen kuohujuoma lasissa -->
                        <path d="M46.5 40 L83.5 40 L81 65 C79.5 77, 73 84, 65 84 C57 84, 50.5 77, 49 65 Z" 
                              fill="#EAD293"/>
                        <!-- Kuplia -->
                        <circle cx="58" cy="34" r="1.8" fill="#D9B773"/>
                        <circle cx="71" cy="31" r="2.2" fill="#D9B773"/>
                        <circle cx="64" cy="27" r="1.5" fill="#D9B773"/>

                        <!-- Luukun numero 31 -->
                        <text x="65" y="69" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="26" fill="#2C2A29">
                            31
                        </text>
                        ${checkBadge}
                    </svg>`;
                }

                // 4) VUOROTTELEVAT JOULUKUUSI JA KORISTEPALLO (Muut päivät)
                const isTree = day % 2 === 1;

                if (isTree) {
                    // JOULUKUUSEN MUOTOINEN LUUKKU
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <rect x="56" y="114" width="18" height="16" rx="3" fill="#9C8467"/>
                        <path d="M65 14 
                                 L93 50 L81 50 
                                 L104 82 L89 82 
                                 L115 115 L15 115 
                                 L41 82 L26 82 
                                 L49 50 L37 50 Z" 
                              fill="${color.fill}" stroke="${color.accent}" stroke-width="1.5" stroke-linejoin="round"/>
                        <circle cx="65" cy="12" r="4" fill="#D9B773"/>
                        <text x="65" y="92" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="28" fill="${color.text}">
                            ${numStr}
                        </text>
                        ${checkBadge}
                    </svg>`;
                } else {
                    // JOULUPALLON / KORISTEPALLON MUOTOINEN LUUKKU
                    return `
                    <svg viewBox="0 0 130 145" class="w-full h-full drop-shadow-sm overflow-visible">
                        <circle cx="65" cy="14" r="5" fill="none" stroke="#9C8C74" stroke-width="2"/>
                        <rect x="56" y="19" width="18" height="10" rx="2.5" fill="#C9B282"/>
                        <circle cx="65" cy="77" r="49" fill="${color.fill}" stroke="${color.accent}" stroke-width="1.5"/>
                        <path d="M36 52 A 36 36 0 0 1 56 37" fill="none" stroke="#FDFBF7" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
                        <text x="65" y="86" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="29" fill="${color.text}">
                            ${numStr}
                        </text>
                        ${checkBadge}
                    </svg>`;
                }
            }

            // Piirtää kaikki 31 luukkua ruudukkoon
            function renderCalendar() {
                calendarGrid.innerHTML = '';

                for (let day = 1; day <= 31; day++) {
                    const isOpened = openedDoors.includes(day);
                    const unlocked = isDoorUnlocked(day);

                    const doorBtn = document.createElement('button');
                    doorBtn.type = 'button';
                    doorBtn.setAttribute('aria-label', `Luukku ${day}`);
                    doorBtn.className = `door-card relative w-32 h-36 sm:w-36 sm:h-40 flex items-center justify-center focus:outline-none ${!unlocked ? 'opacity-95' : ''}`;
                    doorBtn.innerHTML = createDoorSVG(day, isOpened);

                    doorBtn.addEventListener('click', () => {
                        if (isDoorUnlocked(day)) {
                            openDoorModal(day);
                        } else {
                            // Ravistetaan luukkua ja näytetään ilmoitus
                            doorBtn.classList.remove('shake-door');
                            void doorBtn.offsetWidth;
                            doorBtn.classList.add('shake-door');
                            showLockedToast(day);
                        }
                    });

                    calendarGrid.appendChild(doorBtn);
                }
            }

            // Tapahtumankuuntelijat
            previewToggle.addEventListener('change', renderCalendar);
            closeModalBtn.addEventListener('click', closeDoorModal);
            modalActionBtn.addEventListener('click', closeDoorModal);

            // Sulje modaali klikkaamalla taustaa
            doorModal.addEventListener('click', (e) => {
                if (e.target === doorModal) {
                    closeDoorModal();
                }
            });

            // Sulje modaali Esc-näppäimellä
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !doorModal.classList.contains('hidden')) {
                    closeDoorModal();
                }
            });

            // Nollaa avatut luukut
            resetProgressBtn.addEventListener('click', () => {
                openedDoors = [];
                localStorage.removeItem(STORAGE_KEY);
                renderCalendar();
            });

            // Alustetaan kalenteri sivun latautuessa
            renderCalendar();
        });
    </script>
